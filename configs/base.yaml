# Reference run: ~186M parameters, 10.1B tokens (~54 tok/param).
#
# Sized for one 80GB A100 at micro_batch 16 x 2048 ctx. On smaller cards drop
# micro_batch_size and raise grad_accum_steps by the same factor -- the global
# batch, and therefore the loss curve, is unchanged.

model:
  vocab_size: 32768
  n_dim: 896
  n_layer: 18
  n_head: 14          # head_dim = 64, the size the flash kernels are tuned for
  n_kv_head: 2        # GQA, 7 query heads per KV head (Qwen2-0.5B geometry)
  n_seq: 2048
  rope_theta: 10000.0
  dropout: 0.0
  tie_embeddings: true
  init_std: 0.02
  z_loss_weight: 1.0e-4
  loss_chunk_size: 512
  activation_checkpointing: false

data:
  data_dir: dataset/tokens
  tokenizer_file: artifacts/tokenizer-32768.txt
  raw_dir: dataset/raw
  val_shards: 1
  val_batches: 40
  seed: 1337

optim:
  micro_batch_size: 16
  grad_accum_steps: 8       # global batch 128 seqs = 262k tokens/step
  # 38400 x 262,144 = 10.07B tokens. Well past Chinchilla-optimal for 186M
  # params, which is the point: inference cost is fixed by the parameter count,
  # so the extra tokens are the cheapest quality available at this size.
  max_steps: 38400
  peak_lr: 5.0e-4
  min_lr_ratio: 0.1
  warmup_frac: 0.02
  schedule: cosine
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

sft:
  # One pass over the instruction data. Earlier 3-epoch runs showed val loss
  # flat after epoch 1 (1.3986 -> 1.3968 over the last ~900 steps) while the
  # extra passes kept eroding general language modelling.
  epochs: 1
  # 2048, matching the pretrained context. At 1024 the back half of the window
  # never saw a chat template during fine-tuning, and long multi-turn examples
  # were dropped at render time instead of being trimmed.
  seq_len: 2048
  micro_batch_size: 8       # global batch 32 examples, unchanged from 16x2
  grad_accum_steps: 4
  # Examples per epoch after task resampling; ~6.2k steps at 8x4. Every task
  # fits under its repeat cap at this size, so the delivered mixture matches
  # TASK_WEIGHTS exactly -- the trainer logs delivered vs target share.
  mixture_examples: 200000

dpo:
  # Per-token (length-normalised) logratios, so beta carries roughly the mean
  # reply length compared to a summed-logratio setup. peak_lr is 10x the old
  # 5e-7: at that rate, with the gradient clipped ~18x every step, nothing moved.
  length_normalize: true
  beta: 2.0
  peak_lr: 5.0e-6
  seq_len: 2048             # must match sft.seq_len
  # Both branches of every pair go through the model, so a micro-batch of N
  # pairs is 2N sequences; halved alongside the doubled context.
  micro_batch_size: 4
  grad_accum_steps: 8
  mixture_pairs: 40000      # ~1.25k steps; DPO is a nudge, not a second SFT

runtime:
  out_dir: artifacts
  log_dir: logs
  compile: true
  compile_mode: default
  dtype: bfloat16
  log_every: 50
  eval_every: 500
  sample_every: 1000
  ckpt_every: 500
  snapshot_every: 5000
  plot_every: 200
  tensorboard: false
  wandb: false
  seed: 1337
  resume: auto
